services:
  safellm:
    build: .
    image: safellm-agent
    container_name: safellm-agent
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    volumes:
      # Persist configuration
      - ./config.json:/app/config.json
      # Persist memory
      - ./MEMORY.md:/app/MEMORY.md
      # Persist sessions
      - ./.safellm:/app/.safellm
      # Mount source code for development (updates apply immediately)
      - ./src:/app/src

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - RUNNING_IN_DOCKER=true

